<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04060f" />
  <title>Happy Birthday, Meri Maa ♥</title>

  <!-- Preconnect to Fonts & CDNs for instant mobile loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://esm.sh" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            script: ['"Great Vibes"', 'cursive'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            midnight: { 950: '#03050d', 900: '#060a1a', 800: '#0b1330', 700: '#142048' },
            gold: { 200: '#fbe7b8', 300: '#f5d48c', 400: '#e9b95e', 500: '#d49a3a' },
            rose: { 200: '#ffd6df', 300: '#ffb6c1', 400: '#ff8fab', 500: '#e8638a' },
          },
        },
      },
    };
  </script>

  <style>
    html {
      scrollbar-gutter: stable;
      background: #03050d;
      -webkit-text-size-adjust: 100%;
    }
    body {
      background: #03050d;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body.locked {
      overflow: hidden;
      touch-action: none;
    }
    ::selection {
      background: rgba(255, 143, 171, .35);
      color: #fff;
    }

    /* Shimmering gold text */
    .gold-text {
      display: inline-block;
      background: linear-gradient(100deg, #b8862f 0%, #f5d48c 20%, #fff6dc 32%, #e9b95e 45%, #ffb6c1 62%, #f5d48c 78%, #b8862f 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: shimmer 7s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Film grain for cinematic texture (desktop only for 60/120fps mobile performance) */
    @media (min-width: 769px) {
      .grain::after {
        content: "";
        position: fixed;
        inset: -50%;
        pointer-events: none;
        z-index: 60;
        opacity: .04;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        animation: grain 1.2s steps(6) infinite;
      }
      @keyframes grain {
        0% { transform: translate(0,0) }
        25% { transform: translate(-3%,2%) }
        50% { transform: translate(2%,-3%) }
        75% { transform: translate(-2%,-1%) }
        100% { transform: translate(0,0) }
      }
    }

    /* Vinyl grooves */
    .vinyl {
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), transparent 40%),
        repeating-radial-gradient(circle at 50% 50%, #0b0d18 0px, #0b0d18 2px, #151a2e 3px, #0b0d18 4px),
        #0b0d18;
    }

    /* Seek bar */
    input[type=range].seek {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      width: 100%;
      height: 18px;
      cursor: pointer;
    }
    input[type=range].seek::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 9px;
      background: linear-gradient(90deg, #f5d48c var(--p,0%), rgba(255,255,255,.12) var(--p,0%));
    }
    input[type=range].seek::-moz-range-track {
      height: 3px;
      border-radius: 9px;
      background: rgba(255,255,255,.12);
    }
    input[type=range].seek::-moz-range-progress {
      height: 3px;
      border-radius: 9px;
      background: #f5d48c;
    }
    input[type=range].seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      margin-top: -5px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff6dc;
      box-shadow: 0 0 12px #f5d48c, 0 0 24px rgba(255,182,193,.6);
    }
    input[type=range].seek::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      background: #fff6dc;
      box-shadow: 0 0 12px #f5d48c;
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.12em;
      background: #f5d48c;
      box-shadow: 0 0 10px #f5d48c;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain::after, .gold-text { animation: none; }
    }
  </style>

  <!-- React 18 + Framer Motion Import Map (Fast native ES modules) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/": "https://esm.sh/react@18.3.1/",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react-dom/": "https://esm.sh/react-dom@18.3.1/",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom"
    }
  }
  </script>
</head>

<body class="locked grain font-sans text-white antialiased">
  <div id="root"></div>

  <!-- Precompiled ultra-smooth React bundle (Zero runtime Babel overhead) -->
  <script type="module" src="app.js"></script>
</body>
</html>
